# Smithery configuration for the Mad Check MCP server (stdio, local).
# Smithery builds this from the repo root; the server itself lives in mcp/.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      madCheckApiBase:
        type: string
        default: "https://api.madcheck.xyz"
        description: "Mad Check API base URL. Defaults to the public mirror; no API key exists or is needed."
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['mcp/server.mjs'],
      env: config.madCheckApiBase ? { MAD_CHECK_API_BASE: config.madCheckApiBase } : {}
    })
  exampleConfig:
    madCheckApiBase: "https://api.madcheck.xyz"
